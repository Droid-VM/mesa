name: Guest Mesa GLVND arm64 deb

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guest-mesa-glvnd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    name: Build arm64 deb
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      BUILD_DIR: build-guest-glvnd
      STAGE_DIR: install-guest-glvnd
      NINJA_JOBS: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bison \
            build-essential \
            cmake \
            flex \
            glslang-tools \
            libdrm-dev \
            libelf-dev \
            libexpat1-dev \
            libglvnd-dev \
            libudev-dev \
            libvulkan-dev \
            libwayland-dev \
            libwayland-egl-backend-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-dri2-0-dev \
            libxcb-dri3-dev \
            libxcb-glx0-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxdamage-dev \
            libxext-dev \
            libxrandr-dev \
            libxshmfence-dev \
            libxxf86vm-dev \
            libzstd-dev \
            ninja-build \
            pkg-config \
            python3-venv \
            wayland-protocols \
            zlib1g-dev

      - name: Install Meson and Python build dependencies
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install 'meson>=1.4' mako packaging pyyaml
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          test "$(uname -m)" = aarch64
          meson setup "$BUILD_DIR" \
            --buildtype release \
            --prefix /usr/local \
            --libdir lib/aarch64-linux-gnu \
            -Dplatforms=x11,wayland \
            -Dvulkan-drivers=gfxstream,freedreno \
            -Dfreedreno-kmds=msm,virtio \
            -Dgallium-drivers=zink,freedreno \
            -Dopengl=true \
            -Dgbm=enabled \
            -Dglx=dri \
            -Degl=enabled \
            -Dglvnd=enabled \
            -Dshader-cache-default=true \
            -Dvulkan-manifest-per-architecture=true \
            -Dallow-fallback-for=perfetto

          grep -Eq 'GLVND[[:space:]]*:[[:space:]]*YES' \
            "$BUILD_DIR/meson-logs/meson-log.txt"

      - name: Build and stage install
        run: |
          ninja -C "$BUILD_DIR" -j "$NINJA_JOBS"
          DESTDIR="$PWD/$STAGE_DIR" ninja -C "$BUILD_DIR" install

          find "$STAGE_DIR" -type f -name 'libEGL_mesa.so*' -print -quit \
            | grep -q .

      - name: Build deb package
        id: package
        run: |
          mesa_version="$(tr -d '\n' < VERSION)"
          package_version="${mesa_version}+git${GITHUB_RUN_NUMBER}.${GITHUB_SHA::8}"
          package_file="mesa-guest-glvnd_${package_version}_arm64.deb"
          installed_size="$(du -sk "$STAGE_DIR" | cut -f1)"

          install -d -m 0755 "$STAGE_DIR/DEBIAN"
          cat > "$STAGE_DIR/DEBIAN/control" <<EOF
          Package: mesa-guest-glvnd
          Version: ${package_version}
          Section: libs
          Priority: optional
          Architecture: arm64
          Installed-Size: ${installed_size}
          Maintainer: Droid-VM <noreply@github.com>
          Depends: libc6, libdrm2, libexpat1, libgcc-s1, libglvnd0, libstdc++6, libudev1, libvulkan1, libwayland-client0, libwayland-egl1, libwayland-server0, libx11-6, libx11-xcb1, libxcb1, libxcb-dri2-0, libxcb-dri3-0, libxcb-glx0, libxcb-present0, libxcb-randr0, libxcb-shm0, libxcb-sync1, libxcb-xfixes0, libxdamage1, libxext6, libxrandr2, libxshmfence1, libxxf86vm1, libzstd1, zlib1g
          Description: Guest Mesa GLVND stack for Droid-VM
           Mesa guest libraries with gfxstream and freedreno Vulkan drivers,
           the Zink Gallium driver, and GLVND vendor libraries.
          EOF

          cat > "$STAGE_DIR/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          ldconfig
          EOF
          cat > "$STAGE_DIR/DEBIAN/postrm" <<'EOF'
          #!/bin/sh
          set -e
          ldconfig
          EOF
          chmod 0755 "$STAGE_DIR/DEBIAN/postinst" "$STAGE_DIR/DEBIAN/postrm"

          dpkg-deb --build --root-owner-group "$STAGE_DIR" "$package_file"
          dpkg-deb --info "$package_file"
          echo "package_file=$package_file" >> "$GITHUB_OUTPUT"

      - name: Upload deb
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.package_file }}
          if-no-files-found: error
          archive: false
          retention-days: 14

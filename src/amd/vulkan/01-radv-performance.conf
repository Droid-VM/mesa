<?xml version="1.0"?>
<!-- Performance tuning for applications. Options in this file must only
     affect performance, never correctness. -->

<driconf>
    <device driver="radv">
        <!-- Engine performance tuning -->
        <engine engine_name_match="mesa zink">
            <!-- Enable this performance heuristic for Zink by default. It
                 should beneficial for apps that switches between lines/points
                 and triangles all the time because it reduces the number of
                 context rolls with the guardband state. -->
            <option name="radv_max_clip_discard_watermark" value="6.0" />
        </engine>

        <!-- Game performance tuning -->
        <application name="Tom Clancy's Ghost Recon Breakpoint" application_name_match="Ghost Recon Breakpoint">
            <!-- The engine uses a dedicated transfer queue for per-frame uploads;
                 route them to the async SDMA engine to offload the compute queue. -->
            <option name="radv_enable_transfer_queue" value="true" />

            <!-- Much faster with 2D swizzle modes for 3D storage images (fog pass). -->
            <option name="radv_prefer_2d_swizzle_for_3d_storage" value="true" />
        </application>

        <application name="Shadow Of The Tomb Raider (Native)" application_name_match="ShadowOfTheTomb">
            <option name="radv_report_llvm9_version_string" value="true" />
            <option name="radv_gfx12_hiz_wa" value="partial" />
        </application>

        <application name="DOOM Eternal" application_name_match="DOOMEternal">
            <option name="radv_force_exclusive_image" value="true" />
        </application>

        <application name="Indiana Jones: The Great Circle" application_name_match="TheGreatCircle">
            <option name="radv_gfx12_hiz_wa" value="partial" />
        </application>

        <application name="Wolfenstein Youngblood" application_name_match="Wolfenstein: Youngblood">
            <option name="radv_force_exclusive_image" value="true" />
        </application>

        <application name="RDR2" application_name_match="Red Dead Redemption 2">
            <option name="radv_enable_unified_heap_on_apu" value="true" />
            <option name="radv_force_exclusive_image" value="true" />
            <option name="radv_gfx12_hiz_wa" value="partial" />
        </application>

        <application name="Persona 3 Reload" application_name_match="P3R.exe">
            <option name="radv_disable_ngg_gs" value="true" />
        </application>

        <!-- Matches both the Windows exe name and the native Feral port's "Dirt4". -->
        <application name="DiRT4" application_name_match="[Dd]i[Rr][Tt]4">
            <option name="radv_gfx12_hiz_wa" value="partial" />
        </application>

        <application name="Strange Brigade (DX12)" application_name_match="StrangeBrigade_DX12.exe">
            <option name="radv_gfx12_hiz_wa" value="partial" />
        </application>

        <application name="Strange Brigade (VK)" application_name_match="Strange">
            <option name="radv_gfx12_hiz_wa" value="partial" />
        </application>

        <application name="Sniper Elite 5 (DX12)" application_name_match="sniper5_dx12.exe">
            <option name="radv_gfx12_hiz_wa" value="partial" />
        </application>

        <application name="Sniper Elite 5 (VK)" application_name_match="Sniper5">
            <!-- The full_rez WA recovers performance by forcing ReZ only
                 while HiZ is disabled. -->
            <option name="radv_gfx12_hiz_wa" value="full_rez" />
        </application>

        <application name="Hunt: Showdown 1896" application_name_match="HuntGame.exe">
            <option name="radv_gfx12_hiz_wa" value="partial" />
        </application>

        <application name="Counter Strike 2" application_name_match="csgo">
            <option name="radv_gfx12_hiz_wa" value="partial" />
        </application>

        <application name="Forza Horizon 5" application_name_match="ForzaHorizon5.exe">
            <option name="radv_gfx12_hiz_wa" value="partial" />
        </application>

        <application name="Far Cry 2" application_name_match="FarCry2.exe">
            <option name="radv_gfx12_hiz_wa" value="partial" />
        </application>

        <application name="DiRT Rally 2.0" application_name_match="dirtrally2.exe">
            <option name="radv_gfx12_hiz_wa" value="partial" />
        </application>

        <application name="Valheim" application_name_match="Valheim">
            <option name="radv_gfx12_hiz_wa" value="partial" />
        </application>

        <application name="The Last of Us Part I" application_name_match="tlou-i.exe">
            <!-- TLOU1 is much faster with 2D swizzle modes for 3D storage images. -->
            <option name="radv_prefer_2d_swizzle_for_3d_storage" value="true" />
        </application>

        <application name="Total War: ROME (Feral)" application_name_match="^Rome$">
            <!-- A compute pass samples a large 3D storage image with a 2D access
                 pattern; a 3D swizzle mode wrecks L2 locality there (+15% FPS). -->
            <option name="radv_prefer_2d_swizzle_for_3d_storage" value="true" />
        </application>

        <application name="BeamNG.drive" application_name_match="BeamNG.drive.x64">
            <option name="radv_gfx12_hiz_wa" value="partial" />
        </application>
    </device>
</driconf>
